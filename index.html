<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<title>NY EMS Scenario Trainer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-y:scroll;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,SF Pro,Inter,system-ui,sans-serif;background:#0a0e1a;color:#fff;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  touch-action:pan-y;min-height:100dvh}
.container{max-width:600px;margin:0 auto;padding:16px}
h1{font-size:1.6em;text-align:center;margin:20px 0 4px}
.subtitle{text-align:center;color:#8b92a8;margin-bottom:24px;font-size:.95em}
.card{background:#141929;border-radius:12px;padding:16px;margin-bottom:12px;transition:all .2s;cursor:pointer;border:2px solid transparent}
.card:active{transform:scale(.98)}
.card.selected{border-color:#d9534f}
.level-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}
.level-card{text-align:center;padding:20px 12px;font-weight:600;font-size:1.1em}
.level-card .desc{font-size:.75em;font-weight:400;color:#8b92a8;margin-top:6px}

.level-card[data-level="CFR"]{border-color:#a0a0a0;color:#a0a0a0}
.level-card[data-level="CFR"].selected{background:rgba(160,160,160,.15);border-color:#a0a0a0}
.level-card[data-level="EMT"]{border-color:#f0ad4e;color:#f0ad4e}
.level-card[data-level="EMT"].selected{background:rgba(240,173,78,.15);border-color:#f0ad4e}
.level-card[data-level="AEMT"]{border-color:#34c759;color:#34c759}
.level-card[data-level="AEMT"].selected{background:rgba(52,199,89,.15);border-color:#34c759}
.level-card[data-level="CC"]{border-color:#4a9eff;color:#4a9eff}
.level-card[data-level="CC"].selected{background:rgba(74,158,255,.15);border-color:#4a9eff}

.level-card[data-level="P"]{border-color:#d9534f;color:#d9534f}
.level-card[data-level="P"].selected{background:rgba(217,83,79,.15);border-color:#d9534f}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:1em;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;margin-top:12px}
.btn:active{transform:scale(.97)}
.btn-primary{background:#d9534f;color:#fff}
.btn-primary:disabled{background:#333;color:#666;cursor:not-allowed}
.btn-secondary{background:#1e2440;color:#fff;border:1px solid #2a3154}
.btn-small{display:inline-block;width:auto;padding:8px 16px;font-size:.9em;margin:4px}
.progress-bar{display:flex;gap:4px;margin-bottom:20px}
.progress-step{flex:1;text-align:center;font-size:.7em;color:#8b92a8;padding-bottom:8px;border-bottom:3px solid #1e2440}
.progress-step.active{color:#d9534f;border-color:#d9534f}
.progress-step.done{color:#34c759;border-color:#34c759}
.narrative{background:#141929;border-radius:12px;padding:16px;margin-bottom:16px;line-height:1.6;font-size:.95em}
.narrative .label{color:#d9534f;font-weight:600;font-size:.8em;text-transform:uppercase;margin-bottom:6px}
.vitals-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:12px 0}
.vital{background:#0d1020;border-radius:8px;padding:8px;text-align:center}
.vital .val{font-size:1.1em;font-weight:600}
.vital .lbl{font-size:.7em;color:#8b92a8;margin-top:2px}
.option{background:#141929;border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;border:2px solid #1e2440;transition:all .2s;line-height:1.4}
.option:active{transform:scale(.98)}
.option.selected{border-color:#4a9eff;background:rgba(74,158,255,.1)}
.option.correct{border-color:#34c759;background:rgba(52,199,89,.15)}
.option.incorrect{border-color:#d9534f;background:rgba(217,83,79,.15)}
.option.missed{border-color:#f0ad4e;background:rgba(240,173,78,.1)}
.option .indicator{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
.option.correct .indicator{background:#34c759}
.option.incorrect .indicator{background:#d9534f}
.option.missed .indicator{background:#f0ad4e}
.explanation{font-size:.85em;color:#8b92a8;margin-top:8px;padding:10px;background:#0d1020;border-radius:8px;line-height:1.5}
.explanation .ref{color:#4a9eff;font-weight:500;display:block;margin-top:4px;word-break:break-word;font-size:.8em}
.question-prompt{font-size:1em;font-weight:500;margin-bottom:12px;line-height:1.5}
.multi-hint{font-size:.8em;color:#8b92a8;margin-bottom:8px}
.score-circle{width:120px;height:120px;border-radius:50%;margin:20px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2em;font-weight:700}
.score-good{background:rgba(52,199,89,.2);color:#34c759;border:3px solid #34c759}
.score-ok{background:rgba(240,173,78,.2);color:#f0ad4e;border:3px solid #f0ad4e}
.score-bad{background:rgba(217,83,79,.2);color:#d9534f;border:3px solid #d9534f}
.score-circle .pct{font-size:.4em;font-weight:400}
.review-item{background:#141929;border-radius:12px;padding:14px;margin-bottom:10px}
.review-item .q{font-weight:500;margin-bottom:6px;font-size:.95em}
.review-item .your-ans{font-size:.85em;margin-bottom:4px}
.review-item .correct-ans{font-size:.85em;color:#34c759}
.review-item .wrong{color:#d9534f}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:.7em;font-weight:600;margin-right:4px}
.tag-easy{background:rgba(52,199,89,.2);color:#34c759}
.tag-medium{background:rgba(240,173,78,.2);color:#f0ad4e}
.tag-hard{background:rgba(217,83,79,.2);color:#d9534f}
.tag-proto{background:rgba(74,158,255,.2);color:#4a9eff}
.category-header{color:#8b92a8;font-size:.8em;font-weight:600;text-transform:uppercase;margin:16px 0 8px;letter-spacing:.5px}
.scenario-item{display:flex;justify-content:space-between;align-items:center}
.scenario-item .title{font-weight:500;font-size:.95em}
.scenario-item .tags{margin-top:4px}
.hidden{display:none!important}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.back-btn{background:none;border:none;color:#8b92a8;font-size:.9em;cursor:pointer;padding:8px 0;display:flex;align-items:center;gap:4px}
.back-btn:before{content:'←'}
.phase-label{display:inline-block;background:rgba(217,83,79,.2);color:#d9534f;padding:4px 10px;border-radius:6px;font-size:.75em;font-weight:600;margin-bottom:12px;text-transform:uppercase}
.vitals-update-box{background:rgba(217,83,79,.15);border:2px solid #d9534f;border-radius:12px;padding:16px;margin-bottom:16px}
.vitals-update-box .label{color:#d9534f;font-weight:700;font-size:.9em;margin-bottom:8px}
.critical-error{background:#b71c1c;color:#fff;border-radius:8px;padding:12px;margin-top:8px;line-height:1.5;font-size:.85em}
.critical-error .critical-title{font-weight:700;font-size:.95em;margin-bottom:4px}
.clinical-pearl{background:rgba(74,158,255,.12);border:1px solid rgba(74,158,255,.3);border-radius:8px;padding:12px;margin-top:10px;font-size:.85em;line-height:1.5;color:#8bb8f0}
.clinical-pearl .pearl-title{color:#4a9eff;font-weight:600;margin-bottom:2px}
.narrative-update{background:#141929;border-left:3px solid #f0ad4e;border-radius:0 12px 12px 0;padding:16px;margin-bottom:16px;line-height:1.6;font-size:.95em}
.narrative-update .label{color:#f0ad4e;font-weight:600;font-size:.8em;text-transform:uppercase;margin-bottom:6px}
.score-tier{text-align:center;padding:16px;border-radius:12px;margin:16px 0;line-height:1.5}
.score-tier .tier-name{font-size:1.3em;font-weight:700;margin-bottom:4px}
.score-tier .tier-desc{font-size:.9em;opacity:.9}
.score-tier.tier-expert{background:rgba(52,199,89,.15);color:#34c759;border:2px solid #34c759}
.score-tier.tier-competent{background:rgba(240,173,78,.15);color:#f0ad4e;border:2px solid #f0ad4e}
.score-tier.tier-developing{background:rgba(255,152,0,.15);color:#ff9800;border:2px solid #ff9800}
.score-tier.tier-novice{background:rgba(217,83,79,.15);color:#d9534f;border:2px solid #d9534f}
.critical-fails-warning{background:rgba(183,28,28,.2);border:2px solid #b71c1c;border-radius:12px;padding:14px;margin:12px 0;text-align:center;color:#ff5252;font-weight:600}
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const SCENARIOS = [

  // ============================================================
  // SCENARIO 1: 62F — Nausea and Stomach Pain (Atypical ACS)
  // ============================================================
  {
    id: "med-cardiac-01",
    title: "62F — Nausea and Stomach Pain",
    category: "Medical",
    difficulty: "Hard",
    dispatch: "62-year-old female, nausea and stomach pain, conscious and breathing",
    patient: { age: 62, sex: "F", cc: "Nausea and epigastric pain" },
    scene: "You arrive at a suburban home. A 62-year-old female is seated at the kitchen table, appearing pale and diaphoretic. She states she has been having 'bad stomach pain' for about an hour and has vomited twice. She denies chest pain.",
    vitals: { hr: 96, bp: "104/68", rr: 22, spo2: 94, gcs: 15, temp: "98.4°F", bg: "142 mg/dL" },
    history: { pmh: "Hypertension, type 2 diabetes, hyperlipidemia", meds: "Metformin, lisinopril, atorvastatin", allergies: "Sulfa drugs" },
    presentation: "Patient is pale, diaphoretic, and mildly short of breath. She describes a constant, dull epigastric pain radiating to her jaw. She attributes it to something she ate. No chest pain or pressure reported.",
    primary_protocol: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl",
    related_protocols: [
      "bls_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl",
      "als_nausea_andor_vomiting_adult_for_pediatric_see_nausea_andor_vomiting_2_yo_pediatr"
    ],
    level_min: "EMT",
    questions: [
      {
        phase: "scene",
        prompt: "Based on dispatch information, what is your primary concern as you approach the scene?",
        multi_select: false,
        level_filter: "CFR-EMT-AEMT-CC-P",
        narrative: "Dispatch reports a 62-year-old female with nausea and stomach pain. No other units on scene.",
        clinical_pearl: "Women over 55 frequently present with atypical ACS symptoms: nausea, vomiting, epigastric pain, jaw pain, and fatigue — often without classic chest pain. Always maintain high suspicion.",
        options: [
          { text: "Consider atypical cardiac presentation given patient age, sex, and complaint of epigastric pain with nausea", correct: true, critical: false, explanation: "Elderly females commonly present with atypical ACS symptoms including nausea, vomiting, and epigastric pain without chest pain.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Prepare primarily for a gastrointestinal emergency such as bowel obstruction or acute gastroenteritis", correct: false, critical: false, explanation: "While GI causes are possible, the patient's age, sex, and risk factors warrant cardiac consideration first.", protocol_ref: "als_nausea_andor_vomiting_adult_for_pediatric_see_nausea_andor_vomiting_2_yo_pediatr" },
          { text: "Assume food poisoning is most likely given the nausea and vomiting with no reported chest discomfort", correct: false, critical: true, explanation: "Assuming a benign cause without evaluation could delay life-saving ACS treatment. Atypical presentations are common in this demographic.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Focus assessment on diabetic ketoacidosis since the patient has a history of type 2 diabetes mellitus", correct: false, critical: false, explanation: "DKA is more common in type 1 diabetes. While blood glucose should be checked, the presentation is more consistent with a cardiac event.", protocol_ref: "als_altered_mental_status" }
        ]
      },
      {
        phase: "assessment",
        prompt: "After obtaining vitals (HR 96, BP 104/68, RR 22, SpO₂ 94%, GCS 15), what are your priority assessment steps? (Select all that apply)",
        multi_select: true,
        level_filter: "EMT-AEMT-CC-P",
        narrative: "The patient continues to complain of epigastric pain now radiating to her jaw. She appears increasingly diaphoretic.",
        vitals_update: { hr: 102, bp: "98/62", spo2: 93 },
        clinical_pearl: "NY protocols include anginal equivalents as criteria for the cardiac chest pain protocol. Epigastric pain with diaphoresis and jaw radiation in an elderly diabetic female is a classic anginal equivalent.",
        options: [
          { text: "Acquire and transmit a 12-lead ECG to identify possible STEMI or acute cardiac changes", correct: true, critical: false, explanation: "Per NY protocol, EMTs should acquire and transmit a 12-lead ECG for patients with suspected cardiac chest pain or anginal equivalents including nausea, vomiting, and dyspnea.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Administer supplemental oxygen to maintain SpO₂ above 92% with appropriate airway management as indicated", correct: true, critical: false, explanation: "Per NY protocol, airway management and appropriate oxygen therapy is indicated at all provider levels for suspected cardiac events. SpO₂ is 94%, borderline.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Administer ondansetron for nausea relief before proceeding with any further assessment", correct: false, critical: false, explanation: "Treating symptoms before identifying the underlying cause could delay recognition of an acute MI. Assessment takes priority.", protocol_ref: "als_nausea_andor_vomiting_adult_for_pediatric_see_nausea_andor_vomiting_2_yo_pediatr" },
          { text: "Start a fluid bolus of normal saline to treat the borderline hypotension before further workup", correct: false, critical: false, explanation: "While vascular access is appropriate, identifying a STEMI early changes the transport destination and must take priority.", protocol_ref: "als_shock_adult_shock_hypoperfusion_for_pediatric_see_shock_pediatric_shock_sepsis_h" }
        ]
      },
      {
        phase: "assessment",
        prompt: "The 12-lead ECG shows ST elevation in leads II, III, and aVF. Medical control confirms STEMI. What medication should be administered immediately at all provider levels?",
        multi_select: false,
        level_filter: "CFR-EMT-AEMT-CC-P",
        narrative: "Medical control has reviewed the transmitted ECG and confirms an inferior STEMI. The patient now reports feeling lightheaded.",
        clinical_pearl: "Aspirin 324 mg chewed is indicated at ALL provider levels (including CFR) for suspected cardiac events per NY protocol. It should not be enteric coated.",
        options: [
          { text: "Aspirin 324 mg (four 81 mg tablets) chewed, confirming the patient is able to chew them", correct: true, critical: false, explanation: "Per NY protocol, aspirin 324 mg chewed is indicated at CFR and all provider levels for suspected cardiac chest pain or anginal equivalents.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Nitroglycerin 0.4 mg sublingual to reduce cardiac workload and improve coronary perfusion", correct: false, critical: true, explanation: "With BP 98/62 (below 120 mmHg threshold) and an inferior STEMI, nitroglycerin is contraindicated. Inferior STEMIs are prone to right ventricular involvement and hypotension.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Morphine 0.05 mg/kg IV push for pain control before initiating any other cardiac medications", correct: false, critical: false, explanation: "While pain management may be indicated, aspirin is the immediate priority. Morphine also requires CC/Paramedic level and vascular access.", protocol_ref: "als_pain_management_adult_for_pediatric_see_pain_management_pediatric" },
          { text: "Ondansetron 4 mg ODT to address the nausea and vomiting before giving any oral medications", correct: false, critical: false, explanation: "Aspirin is the immediate priority. Delaying aspirin to treat nausea is not appropriate in a confirmed STEMI.", protocol_ref: "als_nausea_andor_vomiting_adult_for_pediatric_see_nausea_andor_vomiting_2_yo_pediatr" }
        ]
      },
      {
        phase: "treatment",
        prompt: "The patient's BP has dropped to 88/54. She is now confused and her skin is cool and clammy. Which interventions are appropriate at the CC/Paramedic level? (Select all that apply)",
        multi_select: true,
        level_filter: "CC-P",
        narrative: "After aspirin administration, the patient becomes increasingly hypotensive and confused. SpO₂ has dropped to 91%.",
        vitals_update: { hr: 110, bp: "88/54", rr: 26, spo2: 91, gcs: 13 },
        clinical_pearl: "Inferior STEMI with hypotension suggests right ventricular involvement. Fluid resuscitation is critical. Avoid nitroglycerin and agents that reduce preload.",
        options: [
          { text: "Place the patient supine and administer a normal saline 500 mL IV bolus to restore perfusion", correct: true, critical: false, explanation: "Per NY protocol, if systolic BP drops below 100 mmHg, place patient supine and consider NS 500 mL IV bolus.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Initiate cardiac monitoring with continuous 12-lead ECG and prepare for rhythm deterioration", correct: true, critical: false, explanation: "Cardiac monitoring is indicated at CC/Paramedic level. STEMI patients are at high risk for dysrhythmias.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Administer nitroglycerin 0.4 mg sublingual to dilate coronary arteries and reduce ischemia", correct: false, critical: true, explanation: "Nitroglycerin is contraindicated when SBP is below 120 mmHg per NY protocol. It could cause cardiovascular collapse in this hypotensive patient.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Administer furosemide 40 mg IV to reduce fluid overload and improve cardiac output quickly", correct: false, critical: true, explanation: "This patient is hypovolemic, not fluid-overloaded. Diuretics would worsen hypotension and are not indicated in this protocol.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" }
        ]
      },
      {
        phase: "treatment",
        prompt: "After fluid resuscitation, the patient's BP improves to 102/66 but she reports worsening pain rated 9/10. What is the appropriate pain management approach?",
        multi_select: false,
        level_filter: "CC-P",
        narrative: "The fluid bolus has improved her hemodynamics. She remains alert but in significant distress from ongoing ischemic pain.",
        vitals_update: { hr: 104, bp: "102/66", spo2: 93, gcs: 15 },
        options: [
          { text: "Fentanyl 1-1.5 mcg/kg IV, which may be repeated after 10 minutes to a max of 200 mcg total", correct: true, critical: false, explanation: "Per NY pain management protocol, fentanyl is appropriate. However, SBP must be >100 mmHg. At 102 mmHg this is borderline — close monitoring required.", protocol_ref: "als_pain_management_adult_for_pediatric_see_pain_management_pediatric" },
          { text: "Ketorolac 15 mg IV as a first-line analgesic since it avoids the respiratory depression of opioids", correct: false, critical: false, explanation: "NSAIDs are generally avoided in acute MI due to increased risk of adverse cardiovascular events and interference with antiplatelet therapy.", protocol_ref: "als_pain_management_adult_for_pediatric_see_pain_management_pediatric" },
          { text: "Nitroglycerin 0.4 mg sublingual since the systolic BP is now above 100 mmHg and pain persists", correct: false, critical: false, explanation: "NY protocol requires SBP >120 mmHg (or MAP >90) for nitroglycerin. At 102/66, this patient does not meet the threshold.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Withhold all pain medication during transport to avoid masking symptoms for the cath lab team", correct: false, critical: false, explanation: "Pain management is indicated per protocol. Untreated pain increases catecholamine release, worsening myocardial oxygen demand.", protocol_ref: "als_pain_management_adult_for_pediatric_see_pain_management_pediatric" }
        ]
      },
      {
        phase: "transport",
        prompt: "With a confirmed STEMI, what is the appropriate transport destination per NY protocol?",
        multi_select: false,
        level_filter: "EMT-AEMT-CC-P",
        narrative: "The patient is packaged and ready for transport. Two hospitals are nearby: a community hospital 8 minutes away and a PCI-capable center 22 minutes away.",
        clinical_pearl: "For confirmed STEMI, transport to a PCI-capable facility if arrival is within 90 minutes of patient contact, or as directed by medical control or regional procedure.",
        options: [
          { text: "Transport to the PCI-capable facility 22 minutes away since it is within 90 minutes of patient contact", correct: true, critical: false, explanation: "Per NY protocol, confirmed STEMI patients should be transported to a facility capable of primary angioplasty if within 90 minutes of patient contact.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Transport to the closest community hospital 8 minutes away for initial stabilization and transfer", correct: false, critical: false, explanation: "Door-to-balloon time is critical in STEMI. Direct transport to PCI-capable center is preferred when within 90 minutes.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" },
          { text: "Contact medical control to request air medical transport to a tertiary cardiac surgery center", correct: false, critical: false, explanation: "With a PCI-capable center only 22 minutes away, ground transport is appropriate and faster than arranging air medical.", protocol_ref: "als_general_approach_to_transportation" },
          { text: "Transport to whichever facility the patient requests since she is alert and oriented with a GCS of 15", correct: false, critical: false, explanation: "While patient preference matters, clinical judgment and protocol direct STEMI patients to PCI-capable facilities for optimal outcomes.", protocol_ref: "als_cardiac_related_problem_chest_pain_adult_for_pediatric_see_cardiac_related_probl" }
        ]
      }
    ]
  },

  // ============================================================
  // SCENARIO 2: 4M — Child with High Fever and Stiff Neck
  // ============================================================
  {
    id: "med-pedi-01",
    title: "4M — Child with High Fever and Stiff Neck",
    category: "Medical",
    difficulty: "Hard",
    dispatch: "4-year-old male, high fever, mother states child is 'acting strange'",
    patient: { age: 4, sex: "M", cc: "High fever and altered behavior" },
    scene: "You arrive at an apartment to find a 4-year-old male lying on a couch, appearing lethargic. His mother reports the fever started yesterday and has gotten worse. She states he had a brief episode of 'shaking all over' about 20 minutes ago that lasted approximately 90 seconds.",
    vitals: { hr: 162, bp: "86/52", rr: 32, spo2: 96, gcs: 13, temp: "104.2°F", bg: "98 mg/dL" },
    history: { pmh: "None significant, immunizations up to date", meds: "Children's Tylenol given 3 hours ago", allergies: "NKDA" },
    presentation: "Child is lethargic but arousable, warm and flushed. He cries when you attempt to flex his neck. A non-blanching petechial rash is noted on the trunk. Capillary refill is 4 seconds in the extremities.",
    primary_protocol: "als_fever_pediatric",
    related_protocols: [
      "als_altered_mental_status",
      "als_shock_pediatric_sepsis_shock_hypoperfusion",
      "bls_shock_pediatric_sepsis_shock_hypoperfusion"
    ],
    level_min: "EMT",
    questions: [
      {
        phase: "scene",
        prompt: "Upon arrival, the mother reports the child had a 90-second shaking episode 20 minutes ago. What is your primary concern given the full clinical picture?",
        multi_select: false,
        level_filter: "CFR-EMT-AEMT-CC-P",
        narrative: "The child is lethargic on the couch. You notice a rash on his torso as you approach.",
        clinical_pearl: "While febrile seizures are common in children, nuchal rigidity and petechial rash are red flags for meningitis. A simple febrile seizure does not typically present with these findings.",

function cleanProtocolRef(ref) {
  if (!ref) return '';
  // Remove als_/bls_ prefix
  let s = ref.replace(/^(als|bls)_/, '');
  // Remove _for_pediatric_see... and similar cross-ref suffixes
  s = s.replace(/_for_pediatric.*$/, '').replace(/_adult_for.*$/, '').replace(/_undifferentiated.*$/, '');
  // Replace underscores with spaces, title case
  s = s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  // Fix common terms
  s = s.replace('Andor', '&').replace('Dif ', 'Difficulty ').replace('Copd', 'COPD');
  return s;
}

function render() {
  switch(state.screen) {
    case 'home': renderHome(); break;
    case 'select': renderSelect(); break;
    case 'scenario': renderScenario(); break;

  window.scrollTo(0, 0);
}

function selectLevel(level) {
  state.level = level;
  state.screen = 'select';
  render();
}

function getAvailableScenarios() {
  const levelOrder = {CFR:1, EMT:2, AEMT:3, P:4, CC:5};
  const userLevel = levelOrder[state.level] || 1;
  return SCENARIOS.filter(s => {
    const minLevel = levelOrder[s.level_min] || 1;
    return userLevel >= minLevel;
  });
}

function renderSelect() {
  const scenarios = getAvailableScenarios();
  const categories = {};
  scenarios.forEach(s => {
    if (!categories[s.category]) categories[s.category] = [];
    categories[s.category].push(s);
  });

  let html = `
    <button class="back-btn" onclick="state.screen='home';render()">Back</button>
    <h1 style="font-size:1.3em;margin-bottom:4px">Choose a Scenario</h1>
    <p class="subtitle">${scenarios.length} scenarios available</p>
    <button class="btn btn-primary" onclick="startRandom()" style="margin-bottom:20px">🎲 Random Scenario</button>
  `;

  for (const [cat, items] of Object.entries(categories)) {
    html += `<div class="category-header">${cat}</div>`;
    items.forEach(s => {
      const diffClass = s.difficulty === 'Easy' ? 'tag-easy' : s.difficulty === 'Medium' ? 'tag-medium' : 'tag-hard';
      html += `
        <div class="card" onclick="startScenario('${s.id}')" style="margin-bottom:8px">
          <div class="scenario-item">
            <div>
              <div class="title">${s.title}</div>
              <div class="tags" style="margin-top:6px">

              </div>
            </div>
            <span style="color:#8b92a8">›</span>
          </div>
        </div>`;
    });
  }

  app.innerHTML = html;
}

function startRandom() {
  const scenarios = getAvailableScenarios();
  const s = scenarios[Math.floor(Math.random() * scenarios.length)];
  startScenario(s.id);
}

function startScenario(id) {
  state.currentScenario = SCENARIOS.find(s => s.id === id);
  state.questionIndex = 0;
  state.answers = [];
  state.answered = false;
  state.selectedOptions = new Set();
  state.screen = 'scenario';
  render();
}

function getFilteredQuestions() {
  
  const userLevel = state.level;
  return state.currentScenario.questions.filter(q => {
    return q.level_filter.split('-').includes(userLevel);
  });
}

function renderScenario() {
  const s = state.currentScenario;
  const questions = getFilteredQuestions();
  
  if (state.questionIndex >= questions.length) {
    state.screen = 'debrief';
    render();
    return;
  }

  const q = questions[state.questionIndex];
  const phases = ['scene','assessment','treatment','transport'];
  const phaseLabels = {scene:'Scene Size-Up',assessment:'Assessment',treatment:'Treatment',transport:'Transport'};
  
  // Progress bar
  let progressHtml = '<div class="progress-bar">';
  const usedPhases = [...new Set(questions.map(qq => qq.phase))];
  usedPhases.forEach(p => {
    const qIdx = questions.findIndex(qq => qq.phase === p);
    let cls = '';
    if (p === q.phase) cls = 'active';
    else if (qIdx < state.questionIndex) cls = 'done';
    progressHtml += `<div class="progress-step ${cls}">${phaseLabels[p] || p}</div>`;
  });
  progressHtml += '</div>';

  // Vitals
  let vitalsHtml = '';
  if (s.vitals && state.questionIndex === 0) {
    const v = s.vitals;
    vitalsHtml = `
      <div class="narrative">
        <div class="label">Vitals</div>
        <div class="vitals-grid">
          ${v.hr !== undefined ? `<div class="vital"><div class="val">${v.hr}</div><div class="lbl">HR</div></div>` : ''}
          ${v.bp ? `<div class="vital"><div class="val">${v.bp}</div><div class="lbl">BP</div></div>` : ''}
          ${v.rr !== undefined ? `<div class="vital"><div class="val">${v.rr}</div><div class="lbl">RR</div></div>` : ''}
          ${v.spo2 !== undefined ? `<div class="vital"><div class="val">${v.spo2}${typeof v.spo2 === 'number' ? '%' : ''}</div><div class="lbl">SpO₂</div></div>` : ''}
          ${v.gcs !== undefined ? `<div class="vital"><div class="val">${v.gcs}</div><div class="lbl">GCS</div></div>` : ''}
          ${v.temp ? `<div class="vital"><div class="val">${v.temp}</div><div class="lbl">Temp</div></div>` : ''}
          ${v.bg ? `<div class="vital"><div class="val">${v.bg}</div><div class="lbl">BG</div></div>` : ''}
        </div>
      </div>`;
  }

  // Build HTML
  let html = `
    <button class="back-btn" onclick="state.screen='select';render()">Exit Scenario</button>
    ${progressHtml}
    <div style="margin-bottom:6px"><span style="color:#8b92a8;font-size:.85em">${s.title}</span></div>
  `;

  // Show dispatch/scene on first question
  if (state.questionIndex === 0) {
    html += `
      <div class="narrative">
        <div class="label">📟 Dispatch</div>
        ${s.dispatch}
      </div>
      <div class="narrative">
        <div class="label">🏥 Scene</div>
        ${s.scene}
      </div>
      <div class="narrative">
        <div class="label">👤 Patient</div>
        ${s.patient.age}yo ${s.patient.sex === 'M' ? 'male' : 'female'} — ${s.patient.cc}<br>
        <span style="color:#8b92a8;font-size:.9em">PMH: ${s.history.pmh} | Meds: ${s.history.meds} | Allergies: ${s.history.allergies}</span>
      </div>
      <div class="narrative">
        <div class="label">🔍 Presentation</div>
        ${s.presentation}
      </div>
      ${vitalsHtml}
    `;
  }

  // Vitals update (mid-scenario vitals change)
  if (q.vitals_update) {
    const vu = q.vitals_update;
    html += `
      <div class="vitals-update-box">
        <div class="label">⚠️ VITALS UPDATE</div>
        <div class="vitals-grid">
          ${vu.hr !== undefined ? `<div class="vital"><div class="val">${vu.hr}</div><div class="lbl">HR</div></div>` : ''}
          ${vu.bp ? `<div class="vital"><div class="val">${vu.bp}</div><div class="lbl">BP</div></div>` : ''}
          ${vu.rr !== undefined ? `<div class="vital"><div class="val">${vu.rr}</div><div class="lbl">RR</div></div>` : ''}
          ${vu.spo2 !== undefined ? `<div class="vital"><div class="val">${vu.spo2}${typeof vu.spo2 === 'number' ? '%' : ''}</div><div class="lbl">SpO₂</div></div>` : ''}
          ${vu.gcs !== undefined ? `<div class="vital"><div class="val">${vu.gcs}</div><div class="lbl">GCS</div></div>` : ''}
          ${vu.temp ? `<div class="vital"><div class="val">${vu.temp}</div><div class="lbl">Temp</div></div>` : ''}
          ${vu.bg ? `<div class="vital"><div class="val">${vu.bg}</div><div class="lbl">BG</div></div>` : ''}
        </div>
      </div>`;
  }

  // Narrative update (mid-scenario story progression)
  if (q.narrative) {
    html += `
      <div class="narrative-update">
        <div class="label">📋 Update</div>
        ${q.narrative}
      </div>`;
  }

  html += `
    <div class="phase-label">${phaseLabels[q.phase] || q.phase}</div>
    <div class="question-prompt">Question ${state.questionIndex + 1} of ${questions.length}: ${q.prompt}</div>
  `;

  if (q.multi_select) {
    html += `<div class="multi-hint">Select all that apply</div>`;
  }

  // Shuffle options (seeded per question to stay stable on re-render)
  if (!q._shuffled) {
    for (let j = q.options.length - 1; j > 0; j--) {
      const k = Math.floor(Math.random() * (j + 1));
      [q.options[j], q.options[k]] = [q.options[k], q.options[j]];
    }
    q._shuffled = true;
  }

  // Options
  q.options.forEach((opt, i) => {
    let cls = 'option';
    let extra = '';
    
    if (state.answered) {
      if (opt.correct) {
        cls += ' correct';
        extra = `<div class="explanation"><span class="indicator"></span> ✅ ${opt.explanation} <span class="ref">(${cleanProtocolRef(opt.protocol_ref)})</span></div>`;
      } else if (state.selectedOptions.has(i)) {
        cls += ' incorrect';
        if (opt.critical) {
          extra = `<div class="critical-error"><div class="critical-title">⛔ CRITICAL ERROR — This action could cause patient harm</div>${opt.explanation} <span class="ref" style="color:#ffcdd2">(${cleanProtocolRef(opt.protocol_ref)})</span></div>`;
        } else {
          extra = `<div class="explanation"><span class="indicator"></span> ❌ ${opt.explanation} <span class="ref">(${cleanProtocolRef(opt.protocol_ref)})</span></div>`;
        }
      }
    } else {
      if (state.selectedOptions.has(i)) cls += ' selected';
    }

    html += `
      <div class="${cls}" onclick="selectOption(${i})">
        ${opt.text}
        ${extra}
      </div>`;
  });

  // Clinical pearl (shown after answering)
  if (state.answered && q.clinical_pearl) {
    html += `
      <div class="clinical-pearl">
        <div class="pearl-title">💎 Clinical Pearl</div>
        ${q.clinical_pearl}
      </div>`;
  }

  // Button
  if (!state.answered) {
    const disabled = state.selectedOptions.size === 0 ? 'disabled' : '';
    html += `<button class="btn btn-primary" onclick="submitAnswer()" ${disabled}>Submit Answer</button>`;
  } else {
    const isLast = state.questionIndex + 1 >= questions.length;
    const label = isLast ? 'View Results 📊' : 'Next Question →';
    html += `<button class="btn btn-primary" onclick="nextQuestion()">${label}</button>`;
  }

  app.innerHTML = `<div class="fade-in">${html}</div>`;
}

function selectOption(i) {
  if (state.answered) return;
  const q = getFilteredQuestions()[state.questionIndex];
  if (q.multi_select) {
    if (state.selectedOptions.has(i)) state.selectedOptions.delete(i);
    else state.selectedOptions.add(i);
  } else {
    state.selectedOptions = new Set([i]);
  }
  renderScenario();
}

function submitAnswer() {
  if (state.selectedOptions.size === 0) return;
  state.answered = true;
  
  const q = getFilteredQuestions()[state.questionIndex];
  const correctIndices = new Set(q.options.map((o,i) => o.correct ? i : -1).filter(i => i >= 0));
  const selected = state.selectedOptions;
  
  // Check if correct
  let isCorrect = false;
  if (q.multi_select) {
    isCorrect = selected.size === correctIndices.size && [...selected].every(i => correctIndices.has(i));
  } else {
    isCorrect = selected.size === 1 && correctIndices.has([...selected][0]);
  }

  // Check if any selected option is a critical fail
  const hasCriticalFail = [...selected].some(i => q.options[i].critical === true);

  state.answers.push({
    question: q.prompt,
    phase: q.phase,
    correct: isCorrect,
    selected: [...selected].map(i => q.options[i].text),
    correctAnswer: q.options.filter(o => o.correct).map(o => o.text),
    protocol: q.options.find(o => o.correct)?.protocol_ref || '',
    criticalFail: hasCriticalFail
  });

  renderScenario();
}

function nextQuestion() {
  state.questionIndex++;
  state.answered = false;
  state.selectedOptions = new Set();
  render();
}

function renderDebrief() {
  const s = state.currentScenario;
  const total = state.answers.length;
  const correct = state.answers.filter(a => a.correct).length;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  
  let scoreClass = 'score-bad';
  if (pct >= 80) scoreClass = 'score-good';
  else if (pct >= 60) scoreClass = 'score-ok';

  // Scoring tier
  let tierClass, tierName, tierDesc;
  if (pct >= 90) {
    tierClass = 'tier-expert'; tierName = '🏆 Expert';
    tierDesc = 'Outstanding clinical decision-making. You demonstrate mastery of these protocols.';
  } else if (pct >= 70) {
    tierClass = 'tier-competent'; tierName = '✅ Competent';
    tierDesc = 'Solid foundation. Review the protocols you missed to strengthen your practice.';
  } else if (pct >= 50) {
    tierClass = 'tier-developing'; tierName = '📖 Developing';
    tierDesc = "You're building knowledge but need more protocol review before these calls.";
  } else {
    tierClass = 'tier-novice'; tierName = '📚 Novice';
    tierDesc = 'Significant gaps in protocol knowledge. Focused study recommended before providing this level of care.';
  }

  const criticalFails = state.answers.filter(a => a.criticalFail).length;

  let html = `
    <h1 style="font-size:1.3em;text-align:center">📊 Scenario Debrief</h1>
    <p style="text-align:center;color:#8b92a8;margin-bottom:16px">${s.title}</p>
    
    <div class="score-circle ${scoreClass}">
      ${correct}/${total}
      <div class="pct">${pct}%</div>
    </div>
    
    <div class="score-tier ${tierClass}">
      <div class="tier-name">${tierName}</div>
      <div class="tier-desc">${tierDesc}</div>
    </div>
    ${criticalFails > 0 ? `<div class="critical-fails-warning">⛔ ${criticalFails} Critical Error${criticalFails > 1 ? 's' : ''} — Actions that could cause patient harm</div>` : ''}
    
    <div class="category-header">Question Review</div>
  `;

  state.answers.forEach((a, i) => {
    const icon = a.correct ? '✅' : a.criticalFail ? '⛔' : '❌';
    html += `
      <div class="review-item" ${a.criticalFail ? 'style="border-left:3px solid #b71c1c"' : ''}>
        <div class="q">${icon} Q${i+1}: ${a.question}</div>
        <div class="your-ans ${a.correct ? '' : 'wrong'}">Your answer: ${a.selected.join(', ')}</div>
        ${a.criticalFail ? '<div style="color:#ff5252;font-size:.8em;font-weight:600">⛔ CRITICAL ERROR</div>' : ''}
        ${!a.correct ? `<div class="correct-ans">Correct: ${a.correctAnswer.join(', ')}</div>` : ''}
        <div style="margin-top:4px"><span class="tag tag-proto">${cleanProtocolRef(a.protocol)}</span></div>
      </div>`;
  });

  html += `
    <button class="btn btn-primary" onclick="startRandom()" style="margin-top:16px">🎲 Next Random Scenario</button>
    <button class="btn btn-secondary" onclick="startScenario('${s.id}')">🔄 Try Again</button>
    <button class="btn btn-secondary" onclick="state.screen='select';render()">← Choose Another Scenario</button>
    <button class="btn btn-secondary" onclick="state.screen='home';render()">🏠 Home</button>
    <div style="height:40px"></div>
  `;

  app.innerHTML = `<div class="fade-in">${html}</div>`;
}

// Start
render();
</script>
</body></html>
